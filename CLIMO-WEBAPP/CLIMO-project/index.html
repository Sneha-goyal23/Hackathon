<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CLIMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/index.css">
</head>
<body>
  <div class="stars" id="stars"></div>
  <div class="glow"></div>

  <div class="wrap">
    <div class="logo-badge">
      <svg viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="20" cy="20" r="19" fill="url(#logoGradient)" opacity="0.95"/>
        <g class="logo-sun">
          <circle cx="20" cy="12" r="5.5" fill="#FFD54F"/>
          <path d="M20 4.5 M20 19.5 M11.5 12 M28.5 12 M13 5.5 L25 17 M27 5.5 L15 17" stroke="#FFD54F" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>
        </g>
        <g class="logo-cloud">
          <ellipse cx="17" cy="15" rx="3.5" ry="2.5" fill="#E3F2FD"/>
          <ellipse cx="22" cy="14" rx="3.8" ry="2.8" fill="#E3F2FD"/>
          <ellipse cx="19.5" cy="16.5" rx="4.5" ry="2" fill="#E3F2FD"/>
        </g>
        <g class="logo-land">
          <path d="M8 24 Q12 18 16 22 Q20 17 24 21 Q28 19 32 24 L32 26 Q28 28 24 26 Q20 28 16 26 Q12 28 8 26 Z" fill="#66BB6A"/>
          <path d="M8 24 Q12 19 16 23 Q20 18 24 22 Q28 20 32 24" fill="#81C784" opacity="0.6"/>
        </g>
        <g class="logo-water">
          <path d="M8 26 Q12 24 16 26 Q20 24 24 26 Q28 24 32 26 L32 38 L8 38 Z" fill="#2196F3"/>
          <path d="M8 28 Q12 26.5 16 28 Q20 26.5 24 28 Q28 26.5 32 28" stroke="#64B5F6" stroke-width="0.8" fill="none" opacity="0.7"/>
        </g>
        <defs>
          <linearGradient id="logoGradient" x1="0%" y1="0%" x2="0%" y2="100%">
            <stop offset="0%" style="stop-color:#FFE082;stop-opacity:0.2" />
            <stop offset="50%" style="stop-color:#81C784;stop-opacity:0.15" />
            <stop offset="100%" style="stop-color:#2196F3;stop-opacity:0.2" />
          </linearGradient>
        </defs>
      </svg>
    </div>

    <div class="app-name">CLIMO</div>
    <div class="tagline">Know the sky, Own the day</div>

    <div class="loader"><span></span><span></span><span></span></div>
  </div>

  <div class="footer-mark">ALL INDIA WEATHER &amp; RISK GIS</div>

  <script src="js/index.js"></script>
</body>
</html>
