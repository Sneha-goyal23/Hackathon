name: Build CLIMO Web App to APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    # 1. Download your repository files
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Node.js to run the mobile wrapper tools
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # 3. Create the mobile wrapper inside your specific project folder
    # Note: We tell Capacitor that your HTML files are in the current folder (.)
    - name: Initialize Capacitor Mobile Wrapper
      run: |
        cd "CLIMO-for webapp/CLIMO-project"
        npm init -y
        npm install @capacitor/core @capacitor/cli
        npx cap init "Climo App" "com.climo.webapp" --web-dir=.
        npm install @capacitor/android
        npx cap add android
        npx cap sync android

    # 4. Set up Java environment for Android compilation
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    # 5. Compile the final Android APK
    - name: Build APK via Gradle
      run: |
        cd "CLIMO-for webapp/CLIMO-project/android"
        chmod +x gradlew
        ./gradlew assembleDebug

    # 6. Upload your finished APK so you can download it
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: climo-app-debug-apk
        path: CLIMO-for webapp/CLIMO-project/android/app/build/outputs/apk/debug/app-debug.apk
