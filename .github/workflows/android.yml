name: Build CLIMO Web App to APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    # We use Cordova here because it builds perfectly without requiring interactive setup prompts
    - name: Wrap Web App with Cordova
      run: |
        npm install -g cordova
        cd "CLIMO-for webapp/CLIMO-project"
        
        # Create a temporary cordova structure inside your project folder
        cordova create mobileapp com.climo.webapp "Climo App"
        
        # Copy your HTML web files into Cordova's asset folder
        cp -R * mobileapp/www/ || true
        
        # Build the Android project assets
        cd mobileapp
        cordova platform add android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Build APK via Gradle
      run: |
        cd "CLIMO-for webapp/CLIMO-project/mobileapp/platforms/android"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: climo-app-debug-apk
        path: CLIMO-for webapp/CLIMO-project/mobileapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
