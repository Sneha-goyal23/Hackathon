name: Build CLIMO Web App to APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Initialize Capacitor Mobile Wrapper
      run: |
        cd "CLIMO-for webapp/CLIMO-project"
        npm init -y
        npm install @capacitor/core @capacitor/cli
        npx cap init "Climo App" "com.climo.webapp" --web-dir=. --yes
        npm install @capacitor/android
        npx cap add android
        npx cap sync android

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Build APK via Gradle
      run: |
        cd "CLIMO-for webapp/CLIMO-project/android"
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: climo-app-debug-apk
        path: CLIMO-for webapp/CLIMO-project/android/app/build/outputs/apk/debug/app-debug.apk
